<!-- @dsCard group="05 · Átomos" viewport="700x169" name="Botones" subtitle="Primario, secundario, ghost, peligro y enlace · el primario se hunde 2px al presionar" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--kb-canvas);padding:28px 32px;font-family:var(--kb-f-body)}
  .lead{font-family:var(--kb-f-label);font-size:10px;letter-spacing:.09em;text-transform:none;color:var(--kb-text-3);margin-bottom:16px;text-transform:uppercase}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .kbv-btn{font-family:var(--kb-f-body);font-weight:600;font-size:13px;border:none;cursor:pointer;
    padding:10px 18px;border-radius:var(--kb-r-md);display:inline-flex;align-items:center;gap:8px;
    transition:transform var(--kb-dur-fast) var(--kb-ease-standard),background var(--kb-dur-fast) var(--kb-ease-standard)}
  .kbv-btn-primary{background:var(--kb-primary);color:#fff;box-shadow:0 2px 0 var(--kb-primary-ink)}
  .kbv-btn-primary:active{transform:translateY(2px);box-shadow:0 0 0 var(--kb-primary-ink)}
  .kbv-btn-secondary{background:var(--kb-card);color:var(--kb-text);border:1px solid var(--kb-border-strong);box-shadow:var(--kb-sh-1)}
  .kbv-btn-ghost{background:transparent;color:var(--kb-text-2)}
  .kbv-btn-danger{background:var(--kb-hp);color:#fff;box-shadow:0 2px 0 #a82f2f}
  .kbv-btn-link{background:transparent;color:var(--kb-primary-ink);padding:10px 4px;font-weight:600}
  .kbv-icon-btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--kb-surface-2);color:var(--kb-text-2);border-radius:var(--kb-r-sm)}
  .sub{font-family:var(--kb-f-label);font-size:10px;color:var(--kb-text-3);margin:18px 0 10px;letter-spacing:.09em;text-transform:uppercase}
</style></head>
<body class="kb-root">
  <div class="lead">Buttons · variants</div>
  <div class="row">
    <button class="kbv-btn kbv-btn-primary">Crear misión</button>
    <button class="kbv-btn kbv-btn-secondary">Volver</button>
    <button class="kbv-btn kbv-btn-ghost">Cancelar</button>
    <button class="kbv-btn kbv-btn-danger">Eliminar</button>
    <button class="kbv-btn kbv-btn-link">Saber más →</button>
    <button class="kbv-btn kbv-icon-btn">＋</button>
  </div>
  <div class="sub">Primary carries a 2px hard bottom border and presses down on :active.</div>
</body></html>
