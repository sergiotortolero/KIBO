<!-- @dsCard group="09 · KIBO" viewport="700x526" name="Rueda de acción rápida" subtitle="El KiboQuickWheel REAL — tócalo y apunta, como cambiar de arma en GTA V" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../reference/kibo-blob.css">
<link rel="stylesheet" href="../reference/kibo-blob-extras.css">
<link rel="stylesheet" href="../reference/kibo-wheel.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0}
body{background:var(--kb-surface);font-family:var(--kb-f-body);width:700px;box-sizing:border-box;position:relative;min-height:526px;overflow:hidden}
.lead{font-family:var(--kb-f-label);font-size:10px;font-weight:700;color:var(--kb-text-3);margin:0;padding:15px 18px 11px;letter-spacing:.09em;text-transform:uppercase}
.lead b{color:var(--kb-primary-ink)}
/* lienzo: simula la app para que la rueda tenga su canaleta real */
.canvas{position:relative;height:474px;margin:0 18px;background:var(--kb-card);border:1px solid var(--kb-border);border-radius:var(--kb-r-md);box-shadow:var(--kb-sh-1);overflow:hidden}
.fake{position:absolute;inset:13px 163px 13px 13px;display:flex;flex-direction:column;gap:8px;opacity:.5}
.fake i{display:block;border-radius:var(--kb-r-sm);background:var(--kb-surface-2)}
.fake i:nth-child(1){height:26px;width:56%}
.fake i:nth-child(2){height:58px}
.fake i:nth-child(3){height:58px;width:74%}
.fake i:nth-child(4){height:26px;width:42%}
.fake i:nth-child(5){height:58px;width:88%}
.gut{position:absolute;top:0;right:0;bottom:0;width:150px;border-left:1px dashed color-mix(in oklab,var(--kb-primary) 32%,transparent);background:color-mix(in oklab,var(--kb-primary) 3%,transparent);pointer-events:none}
.gut span{position:absolute;top:7px;left:0;right:0;text-align:center;font-family:var(--kb-f-label);font-size:10px;font-weight:700;color:var(--kb-primary-ink);letter-spacing:.09em;text-transform:uppercase}
/* KIBO en su esquina, tal como vive en la app */
/* Cuando la rueda abre, ella pone su propio KIBO al centro: el de la esquina se
   desmonta o se ve un segundo KIBO apagado detrás del velo. */
.corner{position:absolute;right:14px;bottom:12px;z-index:60}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px 18px 15px}
.r{background:var(--kb-card);border:1px solid var(--kb-border);border-radius:var(--kb-r-sm);box-shadow:var(--kb-sh-1);padding:8px 10px}
.rn{font-family:var(--kb-f-display);font-weight:800;font-size:11.5px;color:var(--kb-text);display:block;line-height:1.25}
.rd{font-size:10.5px;color:var(--kb-text-2);line-height:1.42;margin:2px 0 0}
.rd code{font-family:var(--kb-f-label);font-weight:700;font-size:10px;color:var(--kb-primary-ink);letter-spacing:.09em;text-transform:uppercase}
.lead code{font-family:var(--kb-f-label);font-weight:700;color:var(--kb-primary-ink)}
.rd u{text-decoration:none;color:#B3261E;font-weight:800}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--kb-r-pill);background:var(--kb-text);color:#fff;font-family:var(--kb-f-label);font-size:11px;font-weight:700;box-shadow:var(--kb-sh-pop);white-space:nowrap;max-width:90%;letter-spacing:.09em;text-transform:uppercase}
</style></head>
<body class="kb-root">
  <p class="lead"><b>este es el componente real</b> · <code>kibo-quick.jsx</code> · el disco parte de KIBO, no del centro de la pantalla · <b>tócalo y apunta</b></p>
  <div class="canvas" id="canvas">
    <div class="fake"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="gut"><span>canaleta · 150px</span></div>
    <div class="corner" id="corner"></div>
  </div>
<script type="text/babel" src="../reference/app/icons.jsx"></script>
<script type="text/babel" src="../reference/app/kibo-style.jsx"></script>
<script type="text/babel" src="../reference/app/kibo-blob.jsx"></script>
<script type="text/babel" src="../reference/app/kibo-quick.jsx"></script>
<script type="text/babel">
function Demo() {
  const [open, setOpen] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [gesture, setGesture] = React.useState(null);
  const ref = React.useRef(null);
  const say = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };
  return (
    <React.Fragment>
      {!open && (
        <span ref={ref} onClick={() => setOpen(true)}>
          <KiboBlob size={104} mood="calma" idle={true} gesture={gesture} onClick={() => setOpen(true)} title="Tócalo para abrir la rueda" />
        </span>
      )}
      {typeof KiboQuickWheel === 'function' && (
        <KiboQuickWheel
          open={open}
          onClose={() => setOpen(false)}
          onToast={say}
          onChat={() => say('Abre el chat inmersivo')}
          onDemand={(g) => setGesture(g + '#' + Date.now())}
          origin={ref}
          kiboSize={104} />
      )}
      {toast && ReactDOM.createPortal(<div className="toast">{toast}</div>, document.getElementById('canvas'))}
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('corner')).render(<Demo />);
</script>
</body></html>
