<!-- @dsCard group="08 · Datos" viewport="700x642" name="Datos · tendencia y comparativa" subtitle="LineChart, BarsChart y WeekdayBars reales — con el filtro de periodo que comparten" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../kbv-components.css">
<link rel="stylesheet" href="../reference/kibo-charts.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body{margin:0}
body{background:var(--kb-surface);padding:16px 18px;font-family:var(--kb-f-body);width:700px;box-sizing:border-box}
.lead{font-family:var(--kb-f-label);font-size:10.5px;font-weight:700;color:var(--kb-text-3);margin:0 0 11px;letter-spacing:.09em;text-transform:uppercase}
.lead b{color:var(--kb-primary-ink)}
.ch{background:var(--kb-card);border:1px solid var(--kb-border);border-radius:var(--kb-r-md);box-shadow:var(--kb-sh-1);padding:11px 13px;margin-bottom:9px}
.chh{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.chn{font-family:var(--kb-f-label);font-size:11.5px;font-weight:800;color:var(--kb-primary-ink);flex:none;letter-spacing:.09em;text-transform:uppercase}
.chd{font-size:10.5px;color:var(--kb-text-2);line-height:1.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
.no{font-family:var(--kb-f-label);font-size:10.5px;font-weight:700;color:var(--kb-text-3);line-height:1.6;background:var(--kb-card);border:1px solid var(--kb-border);border-radius:var(--kb-r-sm);padding:10px 12px;margin:0;letter-spacing:.09em;text-transform:uppercase}
.no b{color:var(--kb-primary-ink)}
</style></head>
<body class="kb-root">
  <div class="lead"><b>estas 3 ya existen</b> · monta <b>progress-charts.jsx</b> real — no son recreaciones</div>
  <div id="app"></div>
<script type="text/babel" src="../reference/app/icons.jsx"></script>
<script type="text/babel" src="../reference/app/progress-charts.jsx"></script>
<script type="text/babel">
const { LineChart, BarsChart, WeekdayBars, PeriodFilter, genSeries } = window;
function App() {
  const [period, setPeriod] = React.useState('30d');
  // genSeries devuelve { points, max, total, meta } — no un arreglo
  const series = React.useMemo(() => genSeries ? genSeries(period, { seed: 7, base: 300 }) : null, [period]);
  const short = React.useMemo(() => {
    if (!series) return null;
    const pts = series.points.slice(-7);
    return { ...series, points: pts, max: Math.max(...pts.map(p => p.v), 1) };
  }, [series]);
  return (
    <React.Fragment>
      <div className="ch">
        <div className="chh"><span className="chn">filtro de periodo</span><span className="chd">lo comparten todas · cambia la serie de golpe</span></div>
        {PeriodFilter ? <PeriodFilter period={period} onChange={setPeriod} /> : null}
      </div>
      <div className="ch">
        <div className="chh"><span className="chn">línea · tendencia</span><span className="chd">área rellena, proyección punteada y modo acumulado</span></div>
        {LineChart && series ? <LineChart series={series} height={140} unit="XP" projection={4} projectionLabel="proyectado" /> : null}
      </div>
      <div className="g2">
        <div className="ch">
          <div className="chh"><span className="chn">barras</span><span className="chd">comparar periodos</span></div>
          {BarsChart && short ? <BarsChart series={short} height={110} unit="XP" /> : null}
        </div>
        <div className="ch">
          <div className="chh"><span className="chn">perfil semanal</span><span className="chd">tu día más fuerte, en ámbar</span></div>
          {WeekdayBars ? <WeekdayBars period={period} /> : null}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body></html>
